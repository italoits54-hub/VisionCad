<style>
:root{--bg:#09111e;--panel:#111d2d;--surface:#19283b;--line:#2c4058;--text:#ecf4ff;--muted:#9db0c6;--accent:#22bbd4;--warn:#ffb957;--btn:48px;font:15px system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{min-height:var(--btn);border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:8px 13px;cursor:pointer}button:active{filter:brightness(1.3)}button.active{background:#075c72;border-color:var(--accent);color:white}button:disabled{opacity:.35}.app{display:flex;flex-direction:column;height:100dvh}.top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}.logo{font-weight:800;letter-spacing:.2px;white-space:nowrap}.logo b{color:var(--accent)}.project{flex:1;min-width:70px;max-width:340px;background:#0e1929;border:1px solid var(--line);color:white;border-radius:10px;height:42px;padding:0 10px}.topbutton{white-space:nowrap}.workspace{display:flex;flex:1;min-height:0;position:relative}.side{width:235px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}.sectionlabel{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 2px 8px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolgrid button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:13px}.toolgrid .symbol{font-size:21px}.controlrow{display:flex;gap:8px;align-items:center;margin:8px 0}.controlrow input[type=number]{width:75px;min-height:42px;background:#0b1524;color:white;border:1px solid var(--line);border-radius:9px;padding:8px}.controlrow label{color:var(--muted);font-size:13px}.canvaswrap{position:relative;flex:1;min-width:0;overflow:hidden;background:#08111d}.canvaswrap svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}.floating{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:7px}.floating button{background:#1b3047eF;width:48px;padding:0;font-size:23px}.instructions{position:absolute;left:12px;top:12px;max-width:min(65%,340px);background:#112137ea;border:1px solid #334b65;border-radius:10px;padding:9px 12px;pointer-events:none;font-size:13px;line-height:1.35}.status{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#101e30;border-top:1px solid var(--line);min-height:39px;color:var(--muted);font-size:12px}.status span:nth-child(2){flex:1;text-align:center}.bottom{display:none;gap:7px;padding:7px 9px max(8px,env(safe-area-inset-bottom));overflow-x:auto;background:var(--panel);border-top:1px solid var(--line)}.bottom button{flex:0 0 auto;min-width:70px;display:flex;align-items:center;flex-direction:column;font-size:12px;gap:2px}.bottom .symbol{font-size:21px}.backdrop{display:none;position:fixed;inset:0;background:#0009;z-index:10}.modal{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,450px);max-height:85dvh;overflow:auto;background:var(--panel);padding:18px;border-radius:16px;border:1px solid var(--line);box-shadow:0 12px 50px #0008}.modal.show,.backdrop.show{display:block}.modal h2{margin:0 0 12px;font-size:19px}.modal input,.modal select{width:100%;height:46px;background:#0c1726;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;margin:5px 0 11px}.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.modal p{font-size:13px;color:var(--muted);line-height:1.5}.notice{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#24495b;border:1px solid #3fa4bb;border-radius:12px;padding:11px 16px;font-size:13px;display:none;max-width:90%;z-index:5}.hidden{display:none!important}.switch{display:flex;align-items:center;gap:9px;font-size:14px}.switch input{width:19px;height:19px;accent-color:var(--accent)}@media(max-width:800px){.side{display:none;position:absolute;z-index:12;top:0;bottom:0;left:0;box-shadow:20px 0 80px #0009}.side.open{display:block}.bottom{display:flex}.top{gap:6px;padding-left:7px;padding-right:7px}.topbutton{padding:7px 9px}.logo{font-size:14px}.project{font-size:13px}.status span:nth-child(2){display:none}.status span:last-child{margin-left:auto}.instructions{font-size:12px;max-width:70%;}.floating{top:auto;bottom:12px}.floating button{width:45px;min-height:45px}}
</style>

<body>
<div class="app">
<header class="top"><button id="menuBtn" class="topbutton" title="Menu">☰</button><span class="logo">Vision<b>CAD</b></span><input id="project" class="project" value="Meu desenho" aria-label="Nome do projeto"/><button class="topbutton" id="openBtn">📂 Abrir</button><button class="topbutton" id="saveBtn">⬇ DXF</button></header>
<div class="workspace">
<aside class="side" id="side"><div class="sectionlabel">Ferramentas</div><div class="toolgrid" id="tools"></div><div class="sectionlabel">Ações</div><div class="toolgrid"><button id="undoBtn">↶ Desfazer</button><button id="redoBtn">↷ Refazer</button><button id="fitBtn">▣ Enquadrar</button><button id="newBtn">＋ Novo</button><button id="propBtn">⚙ Propriedades</button><button id="helpBtn">? Ajuda</button></div><div class="sectionlabel">Precisão</div><label class="switch"><input type="checkbox" id="snap" checked/> Atrair à grade</label><div class="controlrow"><label for="gridSize">Grade (mm)</label><input id="gridSize" type="number" min="0.1" step="0.5" value="5"/></div><label class="switch"><input type="checkbox" id="showGrid" checked/> Mostrar grade</label><div class="sectionlabel">Projeto</div><div class="toolgrid"><button id="jsonBtn">⬇ Projeto</button><button id="importJson">⬆ Projeto</button></div><p style="color:var(--muted);font-size:12px;line-height:1.55">Desenhos salvos automaticamente neste navegador. Faça backup em DXF ou Projeto para não perder seus arquivos.</p></aside>
<main class="canvaswrap" id="wrap"><svg id="canvas" aria-label="Área de desenho CAD"></svg><div class="instructions" id="hint">Selecione uma ferramenta. Toque em uma peça para selecionar.</div><div class="floating"><button id="plus" aria-label="Aproximar">＋</button><button id="minus" aria-label="Afastar">−</button><button id="finish" class="hidden" style="width:auto;padding:0 10px;font-size:14px">✓ Finalizar</button><button id="cancel" class="hidden" style="width:auto;padding:0 10px;font-size:14px">✕ Cancelar</button></div><div class="notice" id="toast"></div></main>
</div><div class="status"><span id="coords">X: 0,0 • Y: 0,0 mm</span><span id="state">0 entidades</span><span id="scale">Zoom 100%</span></div><nav class="bottom" id="mobileTools"></nav>
</div>
<div id="backdrop" class="backdrop"></div><div class="modal" id="dialog"><h2 id="dialogTitle"></h2><div id="dialogContent"></div><div class="actions"><button id="dialogCancel">Cancelar</button><button id="dialogOk" class="active">Aplicar</button></div></div>
<input id="fileInput" type="file" accept=".dxf,.json" hidden/>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const svg=$('canvas'), wrap=$('wrap');
const tools=[['select','↖','Selecionar'],['pan','✋','Mover tela'],['line','╱','Linha'],['poly','〰','Polilinha'],['rect','▭','Retângulo'],['circle','◯','Círculo'],['measure','⌖','Medir'],['erase','⌫','Apagar']];
let model=[],hist=[],future=[],tool='select',selected=null,temp=null,drag=null,points=new Map(),view={cx:0,cy:0,s:3},lastMove={x:0,y:0},projectLoaded=false;
function elt(tag,attrs={},parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
function deep(x){return JSON.parse(JSON.stringify(x));}
function commit(){hist.push(deep(model));if(hist.length>80)hist.shift();future=[];saveLocal();updateButtons();}
function saveLocal(){try{localStorage.setItem('visioncad-v1',JSON.stringify({model,view,project:$('project').value}));}catch(e){}}
function loadLocal(){try{let d=JSON.parse(localStorage.getItem('visioncad-v1'));if(d&&Array.isArray(d.model)){model=d.model;view=d.view||view;$('project').value=d.project||'Meu desenho';projectLoaded=true;}}catch(e){}}
function size(){return {w:wrap.clientWidth,h:wrap.clientHeight};}
function toScreen(p){let {w,h}=size();return{x:w/2+(p.x-view.cx)*view.s,y:h/2-(p.y-view.cy)*view.s};}
function fromScreen(x,y){let {w,h}=size();return{x:view.cx+(x-w/2)/view.s,y:view.cy-(y-h/2)/view.s};}
function pointer(e){let box=svg.getBoundingClientRect();return {x:e.clientX-box.left,y:e.clientY-box.top};}
function snapPoint(p,enabled=true){let n=Number($('gridSize').value)||5;return $('snap').checked&&enabled?{x:Math.round(p.x/n)*n,y:Math.round(p.y/n)*n}:p;}
function fmt(n){return Number(n.toFixed(2)).toLocaleString('pt-BR',{maximumFractionDigits:2});}
function pointsOf(o){if(o.type==='line')return [o.a,o.b];if(o.type==='poly')return o.pts;if(o.type==='rect')return [o.a,{x:o.b.x,y:o.a.y},o.b,{x:o.a.x,y:o.b.y}];if(o.type==='circle')return [{x:o.c.x-o.r,y:o.c.y-o.r},{x:o.c.x+o.r,y:o.c.y+o.r}];return []}
function render(){svg.replaceChildren();let {w,h}=size();if(!w||!h)return;elt('rect',{x:0,y:0,width:w,height:h,fill:'#08111d'});let grid=Number($('gridSize').value)||5,step=grid*view.s;
if($('showGrid').checked&&step>=8){let p0=fromScreen(0,h),p1=fromScreen(w,0);let major=step>=34?1:5;let count=0;for(let x=Math.ceil(p0.x/grid)*grid;x<=p1.x&&count<500;x+=grid,count++){let s=toScreen({x,y:0}).x;elt('line',{x1:s,y1:0,x2:s,y2:h,stroke:Math.round(x/grid)%major===0?'#203448':'#152539','stroke-width':1});}count=0;for(let y=Math.ceil(p0.y/grid)*grid;y<=p1.y&&count<500;y+=grid,count++){let s=toScreen({x:0,y}).y;elt('line',{x1:0,y1:s,x2:w,y2:s,stroke:Math.round(y/grid)%major===0?'#203448':'#152539','stroke-width':1});}}
const zero=toScreen({x:0,y:0});elt('line',{x1:0,y1:zero.y,x2:w,y2:zero.y,stroke:'#33586c','stroke-width':1});elt('line',{x1:zero.x,y1:0,x2:zero.x,y2:h,stroke:'#33586c','stroke-width':1});
for(let i=0;i<model.length;i++)drawEntity(model[i],i===selected,false);if(temp)drawEntity(temp,false,true);
if(tool==='poly'&&temp&&temp.pts.length){let a=toScreen(temp.pts[temp.pts.length-1]),b=toScreen(lastMove);elt('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#ffbd5d','stroke-dasharray':'6 5'});}
$('state').textContent=model.length+' entidades'+(selected!==null?' • 1 selecionada':'');$('scale').textContent='Zoom '+Math.round(view.s/3*100)+'%';updateButtons();}
function drawEntity(o,highlight,preview){let color=preview?'#ffbd5d':highlight?'#ffe082':'#4ce0f1',attrs={stroke:color,'stroke-width':highlight?3:2,fill:'none','vector-effect':'non-scaling-stroke','stroke-linecap':'round','stroke-linejoin':'round'};if(preview)attrs['stroke-dasharray']='6 5';let sp=p=>toScreen(p);if(o.type==='line'){let a=sp(o.a),b=sp(o.b);elt('line',{...attrs,x1:a.x,y1:a.y,x2:b.x,y2:b.y});}else if(o.type==='rect'){let a=sp(o.a),b=sp(o.b);elt('rect',{...attrs,x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),width:Math.abs(a.x-b.x),height:Math.abs(a.y-b.y)});}else if(o.type==='circle'){let c=sp(o.c);elt('circle',{...attrs,cx:c.x,cy:c.y,r:o.r*view.s});}else if(o.type==='poly'){let ps=o.pts.map(p=>{let v=sp(p);return v.x+','+v.y}).join(' ');elt(o.closed?'polygon':'polyline',{...attrs,points:ps});}if(highlight)for(let p of pointsOf(o)){let v=sp(p);elt('circle',{cx:v.x,cy:v.y,r:4,fill:'#ffe082',stroke:'#0c1825','stroke-width':1})}}
function distSeg(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=dx*dx+dy*dy?(Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)))):0;return Math.hypot(p.x-a.x-dx*t,p.y-a.y-dy*t)}
function hit(p){let tol=13/view.s;for(let i=model.length-1;i>=0;i--){let o=model[i],d=Infinity;if(o.type==='circle')d=Math.abs(Math.hypot(p.x-o.c.x,p.y-o.c.y)-o.r);else{let ps=pointsOf(o);for(let j=1;j<ps.length;j++)d=Math.min(d,distSeg(p,ps[j-1],ps[j]));if(o.type==='rect'||(o.type==='poly'&&o.closed))d=Math.min(d,distSeg(p,ps[ps.length-1],ps[0]));}if(d<tol)return i;}return null;}
function updateButtons(){$('undoBtn').disabled=!hist.length;$('redoBtn').disabled=!future.length;$('propBtn').disabled=selected===null;}
function notify(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>e.style.display='none',2600)}
function setTool(t){tool=t;temp=null;drag=null;selected=t==='select'?selected:null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));let prompts={select:'Toque uma peça para selecionar. Arraste para mover. Em Propriedades, edite as coordenadas.',pan:'Arraste com um dedo para mover a tela. Use dois dedos para zoom e movimento.',line:'Toque no início e no fim da linha. Dois toques = uma linha.',poly:'Toque nos vértices e use ✓ Finalizar. Pode fechar a polilinha.',rect:'Toque em dois cantos opostos do retângulo.',circle:'Toque no centro e depois em um ponto do raio.',measure:'Toque em dois pontos para medir a distância.',erase:'Toque no elemento que deseja apagar.'};$('hint').textContent=prompts[t];$('finish').classList.toggle('hidden',t!=='poly');$('cancel').classList.toggle('hidden',!['line','poly','rect','circle','measure'].includes(t));render();closeSide();}
function addEntity(e){commit();model.push(e);temp=null;selected=null;render();}
function finishPoly(){if(!temp||temp.type!=='poly'||temp.pts.length<2){notify('Marque pelo menos 2 pontos.');return;}let closed=confirm('Fechar o contorno ligando o último ponto ao primeiro?\nOK = fechar • Cancelar = manter aberto');let e={...temp,closed};addEntity(e);}
function cancel(){temp=null;render();}
function eventClick(p){let q=snapPoint(p);if(tool==='select'){selected=hit(p);render();return;}if(tool==='erase'){let n=hit(p);if(n!==null){commit();model.splice(n,1);selected=null;render();}return;}if(tool==='pan')return;if(tool==='poly'){if(!temp)temp={type:'poly',pts:[]};if(temp.pts.length>=2&&Math.hypot(q.x-temp.pts[0].x,q.y-temp.pts[0].y)<9/view.s){let e={...temp,closed:true};addEntity(e);return;}temp.pts.push(q);render();return;}if(!temp){temp=tool==='circle'?{type:'circle',c:q,r:0}:tool==='line'?{type:'line',a:q,b:q}:tool==='rect'?{type:'rect',a:q,b:q}:tool==='measure'?{type:'measure',a:q,b:q}:null;render();return;}if(tool==='measure'){let d=Math.hypot(q.x-temp.a.x,q.y-temp.a.y);notify('Distância: '+fmt(d)+' mm');temp=null;render();return;}if(tool==='circle'){let r=Math.hypot(q.x-temp.c.x,q.y-temp.c.y);if(r<.001)return notify('Raio precisa ser maior que zero.');addEntity({type:'circle',c:temp.c,r});return;}if(tool==='line'||tool==='rect'){if(Math.hypot(q.x-temp.a.x,q.y-temp.a.y)<.001)return notify('Escolha outro ponto.');addEntity({...temp,b:q});}}
function translate(o,dx,dy){let a=deep(o);function shift(p){p.x+=dx;p.y+=dy}if(a.type==='circle')shift(a.c);else if(a.type==='poly')a.pts.forEach(shift);else{shift(a.a);shift(a.b)}return a;}
function zoom(factor,pixel){let p=fromScreen(pixel.x,pixel.y);view.s=Math.max(.05,Math.min(1000,view.s*factor));let after=fromScreen(pixel.x,pixel.y);view.cx+=p.x-after.x;view.cy+=p.y-after.y;render();saveLocal();}
svg.addEventListener('pointerdown',e=>{if(e.button&&e.pointerType==='mouse')return;svg.setPointerCapture(e.pointerId);let v=pointer(e);points.set(e.pointerId,v);if(points.size>1){temp=tool==='poly'?temp:temp;drag=null;return;}drag={start:v,prev:v,down:fromScreen(v.x,v.y),moved:false,selection:tool==='select'?hit(fromScreen(v.x,v.y)):null,original:null};if(tool==='select'&&drag.selection!==null){selected=drag.selection;drag.original=deep(model[selected]);render();}});
svg.addEventListener('pointermove',e=>{let v=pointer(e),prev=points.get(e.pointerId);if(!prev)return;points.set(e.pointerId,v);let raw=fromScreen(v.x,v.y);lastMove=snapPoint(raw);$('coords').textContent='X: '+fmt(raw.x)+' • Y: '+fmt(raw.y)+' mm';if(points.size===2){let a=[...points.values()],b=[...points.entries()].find(([id])=>id!==e.pointerId)?.[1];if(b){let oldDist=Math.hypot(prev.x-b.x,prev.y-b.y),newDist=Math.hypot(v.x-b.x,v.y-b.y);let mid={x:(v.x+b.x)/2,y:(v.y+b.y)/2};if(oldDist>5&&newDist>5)zoom(newDist/oldDist,mid);view.cx-=(v.x-prev.x)/view.s;view.cy+=(v.y-prev.y)/view.s;render();}return;}if(!drag)return;let delta=Math.hypot(v.x-drag.start.x,v.y-drag.start.y);if(delta>7)drag.moved=true;if(tool==='pan'&&drag.moved){view.cx-=(v.x-drag.prev.x)/view.s;view.cy+=(v.y-drag.prev.y)/view.s;render();}else if(tool==='select'&&drag.selection!==null&&drag.moved){let now=fromScreen(v.x,v.y),initial=drag.down;model[drag.selection]=translate(drag.original,now.x-initial.x,now.y-initial.y);render();}else if(temp&&tool!=='poly'){let q=snapPoint(raw);if(temp.type==='circle')temp.r=Math.hypot(q.x-temp.c.x,q.y-temp.c.y);else temp.b=q;render();}else if(tool==='poly')render();drag.prev=v;});
svg.addEventListener('pointerup',e=>{let v=pointer(e);points.delete(e.pointerId);if(!drag||points.size){if(points.size===0)drag=null;return;}let moved=drag.moved;if(tool==='select'&&drag.selection!==null&&moved){hist.push(deep(model.map((o,i)=>i===drag.selection?drag.original:o)));future=[];saveLocal();render();}else if(!moved)eventClick(fromScreen(v.x,v.y));else if(tool==='pan')saveLocal();drag=null;});
svg.addEventListener('pointercancel',e=>{points.delete(e.pointerId);drag=null;});svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:.87,pointer(e));},{passive:false});
function fit(){if(!model.length){view={cx:0,cy:0,s:3};render();return;}let pts=model.flatMap(pointsOf);let minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));let {w,h}=size();view={cx:(minX+maxX)/2,cy:(minY+maxY)/2,s:Math.max(.05,Math.min(1000,Math.min((w-80)/Math.max(30,maxX-minX),(h-80)/Math.max(30,maxY-minY))))};render();saveLocal();}
function undo(){if(!hist.length)return;future.push(deep(model));model=hist.pop();selected=null;temp=null;render();saveLocal();}function redo(){if(!future.length)return;hist.push(deep(model));model=future.pop();selected=null;temp=null;render();saveLocal();}
function download(name,str,mime){let blob=new Blob([str],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name.replace(/[^\w.\-\u00c0-\u024f ]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function dxf(){let v=[];let pair=(code,val)=>v.push(String(code),String(val));pair(0,'SECTION');pair(2,'HEADER');pair(9,'$ACADVER');pair(1,'AC1015');pair(9,'$INSUNITS');pair(70,4);pair(0,'ENDSEC');pair(0,'SECTION');pair(2,'ENTITIES');const start=t=>{pair(0,t);pair(8,'0')},xy=(x,y)=>{};for(let o of model){if(o.type==='line'){start('LINE');pair(10,o.a.x);pair(20,o.a.y);pair(30,0);pair(11,o.b.x);pair(21,o.b.y);pair(31,0);}if(o.type==='circle'){start('CIRCLE');pair(10,o.c.x);pair(20,o.c.y);pair(30,0);pair(40,o.r);}if(o.type==='poly'||o.type==='rect'){let pts=o.type==='rect'?pointsOf(o):o.pts;start('LWPOLYLINE');pair(90,pts.length);pair(70,o.type==='rect'||o.closed?1:0);for(let p of pts){pair(10,p.x);pair(20,p.y);}}}pair(0,'ENDSEC');pair(0,'EOF');return v.join('\r\n')+'\r\n';}
function parseDxf(text){let lines=text.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/),pairs=[];for(let i=0;i+1<lines.length;i+=2)pairs.push([Number(lines[i].trim()),lines[i+1].trim()]);let result=[],section='',ent=null,verts=[];function num(fields,k,fallback=0){let p=fields.find(x=>x[0]===k);return p?Number(p[1]):fallback}function flush(){if(!ent)return;let t=ent.type,f=ent.fields;if(t==='LINE')result.push({type:'line',a:{x:num(f,10),y:num(f,20)},b:{x:num(f,11),y:num(f,21)}});if(t==='CIRCLE')result.push({type:'circle',c:{x:num(f,10),y:num(f,20)},r:num(f,40)});if(t==='LWPOLYLINE'){let pts=[],p=null;for(let [k,val] of f){if(k===10){p={x:Number(val),y:0};pts.push(p)}else if(k===20&&p)p.y=Number(val);}if(pts.length>1)result.push({type:'poly',pts,closed:(num(f,70)&1)!==0});}if(t==='ARC'){let c={x:num(f,10),y:num(f,20)},r=num(f,40),start=num(f,50)*Math.PI/180,end=num(f,51)*Math.PI/180;while(end<start)end+=Math.PI*2;let count=Math.max(3,Math.ceil((end-start)/(Math.PI/36)));let pts=Array.from({length:count+1},(_,i)=>({x:c.x+r*Math.cos(start+(end-start)*i/count),y:c.y+r*Math.sin(start+(end-start)*i/count)}));result.push({type:'poly',pts,closed:false});}ent=null;}
for(let i=0;i<pairs.length;i++){let [code,val]=pairs[i];if(code===0&&val==='SECTION'){flush();section='';continue;}if(code===2&&!section&&pairs[i-1]?.[1]==='SECTION'){section=val;continue;}if(code===0&&val==='ENDSEC'){flush();section='';continue;}if(section!=='ENTITIES')continue;if(code===0){flush();if(['LINE','CIRCLE','LWPOLYLINE','ARC'].includes(val))ent={type:val,fields:[]};}else if(ent)ent.fields.push([code,val]);}flush();return result.filter(o=>pointsOf(o).every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))&&(o.type!=='circle'||o.r>0));}
function openModal(title,fields,onApply){$('dialogTitle').textContent=title;$('dialogContent').innerHTML=fields;$('dialog').classList.add('show');$('backdrop').classList.add('show');$('dialogOk').onclick=()=>{try{if(onApply()!==false)closeModal()}catch(e){notify(e.message)}};}
function closeModal(){$('dialog').classList.remove('show');$('backdrop').classList.remove('show')}
function props(){if(selected===null)return notify('Selecione uma peça.');let o=model[selected],f='',apply;if(o.type==='circle'){f='<label>Centro X (mm)<input id="px" type="number" step="any" value="'+o.c.x+'"></label><label>Centro Y (mm)<input id="py" type="number" step="any" value="'+o.c.y+'"></label><label>Raio (mm)<input id="pr" type="number" min="0.001" step="any" value="'+o.r+'"></label>';apply=()=>{let x=Number($('px').value),y=Number($('py').value),r=Number($('pr').value);if(!Number.isFinite(x+y+r)||r<=0)throw Error('Valores inválidos');commit();model[selected]={type:'circle',c:{x,y},r};render();};}else if(o.type==='line'||o.type==='rect'){f=['a','b'].map((p,i)=>'<label>Ponto '+(i+1)+' — X (mm)<input id="'+p+'x" type="number" step="any" value="'+o[p].x+'"></label><label>Ponto '+(i+1)+' — Y (mm)<input id="'+p+'y" type="number" step="any" value="'+o[p].y+'"></label>').join('');apply=()=>{let a={x:Number($('ax').value),y:Number($('ay').value)},b={x:Number($('bx').value),y:Number($('by').value)};if(![a.x,a.y,b.x,b.y].every(Number.isFinite))throw Error('Valores inválidos');commit();model[selected]={type:o.type,a,b};render();};}else{f='<p>Edite os vértices da polilinha: um par X,Y por linha, em milímetros.</p><textarea id="vertices" style="width:100%;height:170px;background:#0b1725;color:white;border:1px solid #39506b;border-radius:10px;padding:10px">'+o.pts.map(p=>p.x+', '+p.y).join('\n')+'</textarea><label class="switch"><input type="checkbox" id="closed" '+(o.closed?'checked':'')+'> Fechada</label>';apply=()=>{let pts=$('vertices').value.trim().split('\n').map(line=>line.split(/[,;\s]+/).map(Number)).map(a=>({x:a[0],y:a[1]}));if(pts.length<2||pts.some(p=>!Number.isFinite(p.x)||!Number.isFinite(p.y)))throw Error('Coordenadas inválidas');commit();model[selected]={type:'poly',pts,closed:$('closed').checked};render();};}openModal('Editar geometria • '+o.type,f,apply);}
function closeSide(){$('side').classList.remove('open')}
for(let [id,symbol,label] of tools){for(let container of [$('tools'),$('mobileTools')]){let b=document.createElement('button');b.dataset.tool=id;b.innerHTML='<span class="symbol">'+symbol+'</span><span>'+label+'</span>';b.onclick=()=>setTool(id);container.append(b)}}
$('menuBtn').onclick=()=>$('side').classList.toggle('open');$('openBtn').onclick=()=>{$('fileInput').value='';$('fileInput').click()};$('fileInput').onchange=async e=>{let file=e.target.files[0];if(!file)return;let txt=await file.text();try{let m;if(file.name.toLowerCase().endsWith('.json')){let data=JSON.parse(txt);m=data.model||data;if(!Array.isArray(m))throw Error('Arquivo inválido');}else{m=parseDxf(txt);if(!m.length)throw Error('Não encontrei entidades suportadas (LINE, CIRCLE, ARC, LWPOLYLINE).');}if(model.length&&!confirm('Substituir o desenho atual? Exporte um backup antes, se necessário.'))return;commit();model=m;selected=null;temp=null;$('project').value=file.name.replace(/\.(dxf|json)$/i,'');fit();saveLocal();notify('Arquivo aberto: '+m.length+' entidades.');}catch(err){notify('Erro: '+err.message)}};
$('saveBtn').onclick=()=>{download(($('project').value||'desenho')+'.dxf',dxf(),'application/dxf');notify('DXF gerado em milímetros.');};$('jsonBtn').onclick=()=>download(($('project').value||'projeto')+'.json',JSON.stringify({version:1,model,view,project:$('project').value},null,2),'application/json');$('importJson').onclick=()=>$('openBtn').click();$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;$('fitBtn').onclick=fit;$('plus').onclick=()=>zoom(1.3,{x:size().w/2,y:size().h/2});$('minus').onclick=()=>zoom(1/1.3,{x:size().w/2,y:size().h/2});$('finish').onclick=finishPoly;$('cancel').onclick=cancel;$('propBtn').onclick=props;$('newBtn').onclick=()=>{if(model.length&&!confirm('Criar desenho vazio? O desenho atual será substituído.'))return;commit();model=[];selected=null;temp=null;view={cx:0,cy:0,s:3};$('project').value='Novo desenho';render();saveLocal();};$('helpBtn').onclick=()=>openModal('Como usar o VisionCAD','<p><b>Desenhe:</b> escolha uma ferramenta e toque nos pontos. Linha, círculo e retângulo usam dois toques. Em Polilinha, toque nos vértices e finalize.</p><p><b>Altere:</b> selecione um objeto e arraste para mover. Abra Propriedades para inserir medidas exatas.</p><p><b>Navegue:</b> dois dedos para ampliar e deslocar a tela; ferramenta Mover tela para arrastar com um dedo. No computador, a roda do mouse amplia.</p><p><b>Arquivos:</b> Abra DXF 2D ou projeto JSON e exporte DXF em milímetros. Nem todos os elementos avançados de DXF são suportados nesta primeira versão. DWG ainda não é suportado.</p>',()=>true);$('dialogCancel').onclick=closeModal;$('backdrop').onclick=()=>{closeModal();closeSide()};$('gridSize').onchange=()=>{let n=Number($('gridSize').value);if(!(n>0))$('gridSize').value=5;render();};$('showGrid').onchange=render;$('snap').onchange=render;$('project').onchange=saveLocal;document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='Escape'){cancel();closeModal()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}if(e.key==='Delete'&&selected!==null){commit();model.splice(selected,1);selected=null;render();}});window.addEventListener('resize',render);loadLocal();setTool('select');if(projectLoaded)notify('Projeto recuperado do navegador.');
</script>
